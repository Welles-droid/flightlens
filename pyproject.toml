[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlens"
version = "0.1.0"
description = "PID-tuning verdicts from ArduPilot DataFlash (.BIN) logs"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "pymavlink",
    "pandas",
    "numpy",
    "scipy",
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
flightlens = "flightlens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end runs on real downloaded logs (pytest -m integration)"]
addopts = "-m 'not integration'"
